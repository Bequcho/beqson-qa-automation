name: aiKit bridge self-tests
on:
  pull_request:
    branches: [main, feature/aikit-round2-free-qa, codex/aikit-qa-bridge]
    paths: ['aikit/**', 'package.json', 'package-lock.json', '.github/workflows/aikit-bridge-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:types
      - run: npm run aikit:test
      - run: npm run aikit:check-public
      - run: npx playwright install --with-deps chromium
      - run: npm run aikit:browser-test
