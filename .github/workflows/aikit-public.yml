name: aiKit Public QA (no external browser credits)

on:
  push:
    branches:
      - feature/aikit-round2-free-qa
    paths:
      - 'aikit/**'
      - '.github/workflows/aikit-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-qa:
    name: Locales in isolated Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install existing locked dependencies
        run: npm ci
      - name: Install free Chromium runner dependencies
        run: npx playwright install --with-deps chromium
      - name: Run only public non-destructive aiKit checks
        run: node aikit/bridge/command.mjs SAFE_CHECKS
      # Full traces/screenshots remain local to the runner and are never uploaded.
      # Console output contains an explicit sanitized summary only.
