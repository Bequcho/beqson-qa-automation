name: aiKit Public QA (no external browser credits)

on:
  push:
    branches:
      - feature/aikit-round2-free-qa
    paths:
      - 'aikit/**'
      - '.github/workflows/aikit-public.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Locale coverage'
        required: true
        default: 'remaining'
        type: choice
        options:
          - remaining
          - all

permissions:
  contents: read

jobs:
  public-qa:
    name: Locales in isolated Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install existing locked dependencies
        run: npm ci
      - name: Install free Chromium runner dependencies
        run: npx playwright install --with-deps chromium
      - name: Run only public non-destructive aiKit checks
        shell: bash
        run: |
          if [ "${{ github.event.inputs.scope }}" = "all" ]; then
            node aikit/qa.mjs --all
          else
            node aikit/qa.mjs
          fi
      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aikit-public-qa-${{ github.run_id }}
          path: aikit-qa-results/
          retention-days: 7
          if-no-files-found: warn
