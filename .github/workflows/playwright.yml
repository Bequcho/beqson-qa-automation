name: Playwright Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-24.04
    # Infrastructure budget; individual Playwright timeouts remain unchanged.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
    env:
      CI: 'true'
      BEQSON_BASE_URL: https://beqson.com
      PW_PROJECT: ${{ matrix.project }}
      PW_BROWSER: ${{ matrix.browser }}
      PLAYWRIGHT_HTML_OUTPUT_DIR: ci-artifacts/${{ matrix.project }}/html-report
      PLAYWRIGHT_JSON_OUTPUT_FILE: ci-artifacts/${{ matrix.project }}/results.json
      PLAYWRIGHT_HTML_OPEN: never
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out QA repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check:types

      - name: Install assigned Playwright browser and system dependencies
        run: npx playwright install --with-deps "$PW_BROWSER"

      - name: Run assigned browser profile
        # Expose the first failure; the config's CI retry setting is not used here.
        run: |
          mkdir -p "ci-artifacts/$PW_PROJECT"
          npx playwright test --project="$PW_PROJECT" --workers=1 --retries=0 --trace=on --reporter=list,html,json --output="ci-artifacts/$PW_PROJECT/test-results" 2>&1 | tee "ci-artifacts/$PW_PROJECT/console.log"

      - name: Preserve this job's reports and test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/${{ matrix.project }}/
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: false
